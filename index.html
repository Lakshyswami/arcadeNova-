<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background: #0b0b12;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.container { width: 100%; max-width: 500px; padding: 25px; text-align: center; }

.name-screen h1 { font-size: 28px; margin-bottom: 25px; }

input {
    width: 100%;
    max-width: 350px;
    padding: 16px 20px;
    border: 1px solid #33333f;
    border-radius: 15px;
    background: #171720;
    color: white;
    outline: none;
    font-size: 17px;
    text-align: center;
}

input:focus { border-color: #7777ff; }

.enter-btn {
    display: block;
    width: 100%;
    max-width: 350px;
    margin: 15px auto 0;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background: #ffffff;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s ease;
}

.enter-btn:active { transform: scale(0.96); }

.emoji-screen {
    display: none;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100%;
}

.emoji {
    font-size: 80px;
    user-select: none;
    animation: pulse 1.1s ease-in-out infinite;
}

@keyframes pulse {
    0% { transform: scale(0.75); }
    50% { transform: scale(1.45); }
    100% { transform: scale(0.75); }
}
</style>
</head>

<script>
const nameInput = document.getElementById("nameInput");
const nameScreen = document.getElementById("nameScreen");
const emojiScreen = document.getElementById("emojiScreen");
const enterBtn = document.getElementById("enterBtn");
const voice = document.getElementById("voice");

voice.loop = true;

function start() {
    const name = nameInput.value.trim();

    if (name === "") {
        nameInput.focus();
        return;
    }

    nameScreen.style.display = "none";
    emojiScreen.style.display = "flex";

    voice.currentTime = 0;
    voice.play().catch(() => {});
}

enterBtn.addEventListener("click", start);
nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") start();
});
</script>
