<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<style>
  :root{
    --ig-black:#000;
    --ig-white:#fff;
    --ig-border:#dbdbdb;
    --ig-gray-text:#8e8e8e;
    --ig-blue:#3897f0;
    --ig-bubble-in:#efefef;
    --ig-bubble-out:#3897f0;
    --ig-red:#ed4956;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#000;
  }
  #phone{
    max-width:420px;
    margin:0 auto;
    height:100vh;
    background:var(--ig-white);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    border-left:1px solid #222;
    border-right:1px solid #222;
  }

  /* ---------- Header ---------- */
  #header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--ig-border);
    flex-shrink:0;
    transition:opacity .4s ease;
  }
  #back-arrow{width:22px;height:22px;flex-shrink:0;}
  #avatar-wrap{position:relative; flex-shrink:0;}
  #avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(45deg,#f9ce34,#ee2a7b 60%,#6228d7);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:16px;
    transition:filter .6s ease, background .6s ease;
  }
  #avatar.blocked{
    filter:grayscale(1) brightness(1.15);
  }
  #online-dot{
    position:absolute; right:0; bottom:0;
    width:11px;height:11px;border-radius:50%;
    background:#3fd67c; border:2px solid var(--ig-white);
    transition:opacity .4s ease;
  }
  #header-text{display:flex; flex-direction:column; line-height:1.15;}
  #header-name{font-weight:600; font-size:14.5px; color:var(--ig-black);}
  #header-status{font-size:12px; color:var(--ig-gray-text);}
  #header-icons{margin-left:auto; display:flex; gap:18px; opacity:.85;}
  #header-icons svg{width:23px;height:23px;}

  /* ---------- Thread ---------- */
  #thread{
    flex:1;
    overflow-y:auto;
    padding:14px 12px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .row{display:flex; width:100%; margin-top:6px;}
  .row.out{justify-content:flex-end;}
  .row.in{justify-content:flex-start;}
  .bubble-wrap{position:relative; max-width:75%; display:flex; flex-direction:column;}
  .bubble{
    padding:9px 14px;
    border-radius:20px;
    font-size:14.5px;
    line-height:1.35;
    word-wrap:break-word;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .row.out .bubble{background:var(--ig-bubble-out); color:#fff; border-bottom-right-radius:6px;}
  .row.in .bubble{background:var(--ig-bubble-in); color:#000; border-bottom-left-radius:6px;}

  .meta{font-size:11.5px; color:var(--ig-gray-text); margin-top:3px; text-align:right; padding-right:4px; min-height:14px;}

  .reaction{
    position:absolute;
    bottom:-10px;
    left:-6px;
    background:#fff;
    border-radius:50%;
    width:22px;height:22px;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transform:scale(0);
    animation:reactPop .35s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes reactPop{ to{transform:scale(1);} }

  #starter-day{
    text-align:center; color:var(--ig-gray-text); font-size:12px;
    margin:6px 0 14px;
  }
  #starter-profile{
    display:flex; flex-direction:column; align-items:center; margin:10px 0 22px;
  }
  #starter-avatar{
    width:90px;height:90px;border-radius:50%;
    background:linear-gradient(45deg,#f9ce34,#ee2a7b 60%,#6228d7);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:34px; margin-bottom:10px;
  }
  #starter-name{font-weight:600; font-size:16px;}
  #starter-sub{color:var(--ig-gray-text); font-size:13px; margin-top:2px;}

  /* ---------- Full-screen blocked takeover ---------- */
  #blocked-screen{
    position:absolute;
    inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 34px 0;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
    z-index:30;
  }
  #blocked-screen.show{ opacity:1; pointer-events:auto; }
  #blocked-icon{
    width:64px; height:64px; margin-bottom:22px;
    opacity:0;
    transform:scale(.6);
    transition:opacity .5s ease .15s, transform .5s cubic-bezier(.34,1.56,.64,1) .15s;
  }
  #blocked-screen.show #blocked-icon{ opacity:1; transform:scale(1); }
  #blocked-heading{
    font-size:19px; font-weight:400; color:#262626; line-height:1.4;
    max-width:280px;
    opacity:0; transform:translateY(8px);
    transition:opacity .45s ease .3s, transform .45s ease .3s;
  }
  #blocked-screen.show #blocked-heading{ opacity:1; transform:translateY(0); }
  #blocked-sub{
    font-size:14px; color:#8e8e8e; margin-top:14px; line-height:1.5; max-width:290px;
    opacity:0; transform:translateY(8px);
    transition:opacity .45s ease .45s, transform .45s ease .45s;
  }
  #blocked-screen.show #blocked-sub{ opacity:1; transform:translateY(0); }
  #blocked-link{
    margin-top:22px; color:var(--ig-blue); font-size:14px; text-decoration:none; font-weight:500;
    opacity:0; transition:opacity .45s ease .6s;
  }
  #blocked-screen.show #blocked-link{ opacity:1; }

  #input-disabled-note{
    text-align:center; color:var(--ig-gray-text); font-size:12.5px;
    padding:10px 20px 4px;
  }

  /* ---------- Input bar ---------- */
  #inputbar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-top:1px solid var(--ig-border);
    flex-shrink:0; background:#fff;
  }
  #camera-icon,#mic-icon,#img-icon{width:26px;height:26px; flex-shrink:0; opacity:.85;}
  #msg-input{
    flex:1;
    border:1px solid var(--ig-border);
    border-radius:20px;
    padding:8px 14px;
    font-size:14.5px;
    outline:none;
    background:#fafafa;
  }
  #msg-input:disabled{color:#bbb; background:#f2f2f2;}
  #send-btn{
    color:var(--ig-blue); font-weight:600; font-size:14.5px;
    border:none; background:none; padding:4px 6px; cursor:pointer;
    flex-shrink:0;
  }
  #send-btn:disabled{opacity:.4; cursor:default;}

  /* ---------- Seen tick row for last own message ---------- */
  .seen-row{
    display:flex; justify-content:flex-end; align-items:center; gap:5px;
    margin-top:2px; padding-right:4px;
  }
  .seen-avatar{
    width:14px;height:14px;border-radius:50%;
    background:linear-gradient(45deg,#f9ce34,#ee2a7b 60%,#6228d7);
    opacity:0; transition:opacity .35s ease;
  }
  .seen-avatar.show{opacity:1;}
  .seen-text{font-size:11px; color:var(--ig-gray-text); opacity:0; transition:opacity .35s ease;}
  .seen-text.show{opacity:1;}
</style>
</head>
<body>

<div id="phone">

  <div id="header">
    <svg id="back-arrow" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div id="avatar-wrap">
      <div id="avatar">A</div>
      <div id="online-dot"></div>
    </div>
    <div id="header-text">
      <div id="header-name">ananya._x</div>
      <div id="header-status">Active now</div>
    </div>
    <div id="header-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8"><path d="M22 16.92V21a1 1 0 01-1.09 1A19 19 0 013 4.09 1 1 0 014 3h4.09a1 1 0 011 .75l1 4a1 1 0 01-.29 1L8.5 10.5a14 14 0 006 6l1.75-1.3a1 1 0 011-.24l4 1a1 1 0 01.75 1z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8"><rect x="3" y="7" width="14" height="10" rx="2"/><path d="M21 8l-4 3 4 3V8z"/></svg>
    </div>
  </div>

  <div id="thread">
    <div id="starter-day">Today 4:12 PM</div>
    <div id="starter-profile">
      <div id="starter-avatar">A</div>
      <div id="starter-name">ananya._x</div>
      <div id="starter-sub">Instagram · Message requests</div>
    </div>
    <!-- messages injected here -->
  </div>

  <div id="input-disabled-note" style="display:none;">You can't reply to this conversation.</div>

  <div id="inputbar">
    <svg id="camera-icon" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <input id="msg-input" type="text" placeholder="Message..." autocomplete="off">
    <svg id="img-icon" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <button id="send-btn" disabled>Send</button>
  </div>

  <div id="blocked-screen">
    <svg id="blocked-icon" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.3">
      <circle cx="12" cy="12" r="10.5"/>
      <path d="M4 4l16 16" stroke-width="1.3"/>
      <rect x="7" y="8" width="10" height="8" rx="1.4"/>
      <circle cx="12" cy="12" r="2.4"/>
    </svg>
    <div id="blocked-heading">Sorry, this page isn't available.</div>
    <div id="blocked-sub">The link you followed may be broken, or the page may have been removed.</div>
    <a id="blocked-link" href="#">Go back to Instagram.</a>
  </div>

</div>

<audio id="prank-audio" src="cat-laugh-meme-1.mp3" preload="auto"></audio>

<script>
const thread = document.getElementById('thread');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const avatar = document.getElementById('avatar');
const onlineDot = document.getElementById('online-dot');
const headerStatus = document.getElementById('header-status');
const blockedScreen = document.getElementById('blocked-screen');
const inputDisabledNote = document.getElementById('input-disabled-note');
const inputbar = document.getElementById('inputbar');
const prankAudio = document.getElementById('prank-audio');

let pranked = false;

input.addEventListener('input', () => {
  sendBtn.disabled = input.value.trim().length === 0;
});
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') sendMessage();
});
sendBtn.addEventListener('click', sendMessage);

function scrollDown(){
  thread.scrollTop = thread.scrollHeight;
}

function sendMessage(){
  if(pranked) return;
  const text = input.value.trim();
  if(!text) return;
  pranked = true;

  // 1. Render sent bubble
  const row = document.createElement('div');
  row.className = 'row out';
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  row.appendChild(wrap);
  thread.appendChild(row);

  const seenRow = document.createElement('div');
  seenRow.className = 'seen-row';
  seenRow.innerHTML = '<span class="seen-text">Seen</span><div class="seen-avatar"></div>';
  thread.appendChild(seenRow);

  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;
  scrollDown();

  const seenText = seenRow.querySelector('.seen-text');
  const seenAvatar = seenRow.querySelector('.seen-avatar');

  // 2. "Seen" after a short pause
  setTimeout(() => {
    seenText.classList.add('show');
    seenAvatar.classList.add('show');
    scrollDown();
  }, 1300);

  // 3. 😂 reaction on the message
  setTimeout(() => {
    const reaction = document.createElement('div');
    reaction.className = 'reaction';
    reaction.textContent = '😂';
    wrap.appendChild(reaction);
    scrollDown();
  }, 2600);

  // 4. Blocked
  setTimeout(() => {
    goBlocked();
  }, 4400);
}

function goBlocked(){
  avatar.classList.add('blocked');
  onlineDot.style.opacity = '0';
  headerStatus.textContent = 'Active 2h ago';
  inputbar.style.display = 'none';
  inputDisabledNote.style.display = 'block';
  blockedScreen.classList.add('show');

  // 5. Play the prank audio the moment the full-screen block takes over
  prankAudio.play().catch(() => {
    playFallbackSound();
  });
  prankAudio.onerror = playFallbackSound;
}

// Fallback tone, only used if cat-laugh-meme-1.mp3 can't be found/played
let fallbackPlayed = false;
function playFallbackSound(){
  if(fallbackPlayed) return;
  fallbackPlayed = true;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    for(let i=0;i<3;i++){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      const start = now + i*0.28;
      osc.frequency.setValueAtTime(700 + i*120, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.2, start+0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start+0.28);
    }
  }catch(e){ /* audio unsupported, silently ignore */ }
}
</script>

</body>
</html>
