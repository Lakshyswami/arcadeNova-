<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>will you be my girlfriend? 🥹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#170812;
    --bg-2:#2b0d22;
    --neon-pink:#FF2E76;
    --neon-purple:#9D4EDD;
    --cream:#FDEFF6;
    --gold:#FFD60A;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Nunito', sans-serif;
    color:var(--cream);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, #1a0620);
    background-size: 200% 200%;
    animation: bgShift 14s ease-in-out infinite;
  }
  @keyframes bgShift{
    0%,100%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
  }

  /* ambient glow blobs */
  .glow{
    position:fixed;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.45;
    z-index:0;
    pointer-events:none;
  }
  .glow.one{ width:340px; height:340px; background:var(--neon-pink); top:-80px; left:-80px; }
  .glow.two{ width:300px; height:300px; background:var(--neon-purple); bottom:-100px; right:-60px; }

  /* floating hearts */
  .heart{
    position:fixed;
    top:110%;
    pointer-events:none;
    z-index:1;
    filter: drop-shadow(0 0 6px rgba(255,46,118,0.7));
    animation: floatUp linear infinite;
    user-select:none;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    12%{ opacity:0.75; }
    88%{ opacity:0.6; }
    100%{ transform: translateY(-120vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius:26px;
    box-shadow: 0 0 0 1px rgba(255,46,118,0.08), 0 25px 60px rgba(0,0,0,0.45), 0 0 40px rgba(255,46,118,0.15);
    padding:44px 34px;
    max-width:430px;
    width:100%;
    text-align:center;
    animation: popIn 0.55s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn{
    0%{ transform: scale(0.7) translateY(30px); opacity:0; }
    100%{ transform: scale(1) translateY(0); opacity:1; }
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.6rem;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:8px;
    line-height:1.4;
  }
  p.sub{
    font-size:0.92rem;
    color:#d9b8ce;
    margin-bottom:24px;
  }

  input#nameInput{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color:var(--cream);
    font-family:'Nunito', sans-serif;
    font-size:1rem;
    outline:none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align:center;
  }
  input#nameInput::placeholder, #adminPasswordInput::placeholder{ color:#a586a0; }
  #adminPasswordInput{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color:var(--cream);
    font-family:'Nunito', sans-serif;
    font-size:1rem;
    outline:none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align:center;
    margin-top:6px;
  }
  #adminPasswordInput:focus{
    border-color:var(--neon-pink);
    box-shadow: 0 0 0 4px rgba(255,46,118,0.15);
  }
  #adminPasswordInput.shake{
    animation: shake 0.4s;
    border-color:#ff5c5c;
  }
  input#nameInput:focus{
    border-color:var(--neon-pink);
    box-shadow: 0 0 0 4px rgba(255,46,118,0.15);
  }
  input#nameInput.shake{
    animation: shake 0.4s;
    border-color:#ff5c5c;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }

  .error-msg{
    color:#ff7aa2;
    font-size:0.8rem;
    margin-top:8px;
    min-height:18px;
  }

  button.primary{
    margin-top:20px;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:14px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.02rem;
    cursor:pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 10px 25px rgba(255,46,118,0.4);
  }
  button.primary:hover{ transform: translateY(-2px) scale(1.03); }
  button.primary:active{ transform: scale(0.97); }

  .proposal-emoji{
    font-size:2.8rem;
    margin-bottom:6px;
    animation: pulseHeart 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,46,118,0.6));
  }
  @keyframes pulseHeart{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
  }

  .btn-row{
    position:relative;
    display:flex;
    gap:16px;
    justify-content:center;
    margin-top:30px;
    height:64px;
  }
  .btn-yes, .btn-no{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1rem;
    padding:14px 26px;
    border-radius:14px;
    border:none;
    cursor:pointer;
  }
  .btn-yes{
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    color:white;
    box-shadow: 0 10px 25px rgba(255,46,118,0.4);
    transition: transform 0.15s;
  }
  .btn-yes:hover{ transform: translateY(-2px) scale(1.05); }

  .btn-no{
    background: rgba(255,255,255,0.08);
    color:#c9a9c0;
    border:1px solid var(--glass-border);
    position:absolute;
    left:58%;
    top:0;
    transition: left 0.16s ease, top 0.16s ease;
  }

  .result-card h1{ font-size:1.3rem; }
  .emoji-plain{
    -webkit-text-fill-color: initial;
    background:none;
    -webkit-background-clip:initial;
    background-clip:initial;
    color:var(--cream);
  }
  .flag-strip{
    height:9px;
    width:100%;
    border-radius:8px;
    margin:18px 0;
    background: linear-gradient(90deg, #E40303, #FF8C00, #FFED00, #008026, #004DFF, #750787);
    box-shadow: 0 0 14px rgba(255,255,255,0.25);
  }
  .tag-certified{
    display:inline-block;
    margin-top:6px;
    padding:6px 16px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
    font-family:'Fredoka', sans-serif;
    color:#1a0620;
    background: linear-gradient(90deg, #ffb3c8, #ffd9a0, #fff5a0, #b3f0c0, #b3d1ff, #d9b3ff);
  }

  .again-link{
    display:inline-block;
    margin-top:22px;
    font-size:0.83rem;
    color:#d9b8ce;
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Nunito',sans-serif;
  }

  .confetti{
    position:fixed;
    top:-10px;
    width:9px;
    height:14px;
    z-index:6;
    pointer-events:none;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  .admin-link{
    position:fixed;
    bottom:12px;
    right:16px;
    font-size:0.7rem;
    color:#7a5a72;
    text-decoration:none;
    z-index:3;
    letter-spacing:0.3px;
  }
  .admin-link:hover{ color:#c9a9c0; }

  /* ---- admin panel ---- */
  .admin-wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    padding:40px 20px;
    display:flex;
    justify-content:center;
  }
  .admin-panel{
    width:100%;
    max-width:560px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius:24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45), 0 0 40px rgba(157,78,221,0.15);
    padding:32px;
  }
  .admin-panel h2{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-size:1.5rem;
    margin-bottom:4px;
  }
  .admin-panel p.count{
    color:#d9b8ce;
    font-size:0.85rem;
    margin-bottom:20px;
  }
  .gay-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:420px;
    overflow-y:auto;
  }
  .gay-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: rgba(255,255,255,0.05);
    border:1px solid var(--glass-border);
    padding:12px 16px;
    border-radius:14px;
    font-weight:700;
    gap:12px;
  }
  .gay-list .ts{
    font-size:0.68rem;
    font-weight:400;
    color:#a586a0;
    display:block;
    margin-top:2px;
  }
  .empty-state{
    text-align:center;
    color:#a586a0;
    font-size:0.9rem;
    padding:20px 0;
  }
  .back-link{
    display:inline-block;
    margin-bottom:18px;
    font-size:0.85rem;
    color:#d9b8ce;
    text-decoration:none;
  }
  .admin-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .refresh-btn, .clear-btn{
    background: rgba(255,255,255,0.08);
    border:1px solid var(--glass-border);
    color:var(--cream);
    padding:10px 18px;
    border-radius:12px;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    cursor:pointer;
    font-size:0.82rem;
  }
  .clear-btn{ color:#ff8fa8; }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="glow one"></div>
<div class="glow two"></div>
<div id="heartsBg"></div>

<!-- MAIN APP -->
<div id="app" class="stage">

  <!-- Screen 1: name entry -->
  <div class="card" id="screenName">
    <div class="proposal-emoji">💌</div>
    <h1>hey, what's your name?</h1>
    <p class="sub">type it in so this feels a little more personal 🥹</p>
    <input type="text" id="nameInput" placeholder="your name" maxlength="24" autocomplete="off">
    <div class="error-msg" id="nameError"></div>
    <button class="primary" id="continueBtn">continue</button>
  </div>

  <!-- Screen 2: proposal -->
  <div class="card hidden" id="screenProposal">
    <div class="proposal-emoji">🥹</div>
    <h1>will you be my girlfriend?</h1>
    <p class="sub">choose wisely...</p>
    <div class="btn-row" id="btnRow">
      <button class="btn-yes" id="yesBtn">yes 🥹</button>
      <button class="btn-no" id="noBtn">no</button>
    </div>
  </div>

  <!-- Screen 3: result -->
  <div class="card result-card hidden" id="screenResult">
    <div class="proposal-emoji">🎉</div>
    <h1 id="resultText"></h1>
    <div class="flag-strip"></div>
    <span class="tag-certified">certified GAY 🏳️‍🌈</span>
    <br>
    <button class="again-link" id="againBtn">do it again</button>
  </div>

</div>

<a href="#admin" class="admin-link" id="adminFooterLink">admin</a>

<!-- ADMIN PANEL -->
<div id="adminApp" class="admin-wrap hidden">
  <div class="admin-panel" id="adminLoginPanel">
    <a href="#" class="back-link" id="backLinkLogin">← back to site</a>
    <h2>admin access 🔒</h2>
    <p class="count">enter the password to view the GAY list</p>
    <input type="password" id="adminPasswordInput" placeholder="password" autocomplete="off">
    <div class="error-msg" id="adminPasswordError"></div>
    <button class="primary" id="adminLoginBtn" style="margin-top:16px;">unlock</button>
  </div>

  <div class="admin-panel hidden" id="adminListPanel">
    <a href="#" class="back-link" id="backLink">← back to site</a>
    <h2>GAY list 🏳️‍🌈</h2>
    <p class="count" id="adminCount">loading...</p>
    <ul class="gay-list" id="gayList"></ul>
    <div class="admin-actions">
      <button class="refresh-btn" id="refreshBtn">refresh</button>
      <button class="clear-btn" id="clearBtn">clear list</button>
    </div>
  </div>
</div>

<script>
(function(){
  const FIREBASE_DB_URL = 'https://prank-75eb8-default-rtdb.firebaseio.com/';
  const ADMIN_PASSWORD = 'vivekisgay'; // change this to whatever password you want
  const ADMIN_SESSION_KEY = 'gayListAdminAuthed';

  // ---------- floating hearts background ----------
  const heartsBg = document.getElementById('heartsBg');
  const heartEmojis = ['💗','💖','💕','🩷','💘'];
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*18) + 'px';
    h.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    h.style.animationDuration = (7 + Math.random()*6) + 's';
    heartsBg.appendChild(h);
    setTimeout(()=> h.remove(), 14000);
  }
  setInterval(spawnHeart, 500);
  for(let i=0;i<6;i++) setTimeout(spawnHeart, i*300);

  // ---------- emoji detection ----------
  function containsEmoji(str){
    try{
      return /\p{Extended_Pictographic}/u.test(str);
    }catch(e){
      return /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(str);
    }
  }

  // ---------- blocked name detection ----------
  const BLOCKED_NAMES = ['lakshy', 'luv', 'lakshya'];
  function isBlockedName(str){
    const clean = str.trim().toLowerCase();
    return BLOCKED_NAMES.includes(clean);
  }

  // ---------- safe event binding helper ----------
  function on(id, evt, handler){
    try{
      const el = document.getElementById(id);
      if(el){ el.addEventListener(evt, handler); }
      else{ console.warn('element not found for binding:', id); }
    }catch(err){
      console.error('failed to bind', id, err);
    }
  }

  // ---------- firebase realtime database helpers ----------
  async function getSubmissions(){
    const res = await fetch(FIREBASE_DB_URL + 'submissions.json');
    if(!res.ok) throw new Error('firebase read failed: ' + res.status);
    const data = await res.json();
    if(!data) return [];
    return Object.keys(data).map(key => ({
      id: key,
      name: data[key].name,
      ts: data[key].ts
    }));
  }
  async function saveSubmission(name){
    try{
      await fetch(FIREBASE_DB_URL + 'submissions.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, ts: Date.now() })
      });
    }catch(e){
      console.error('could not save submission', e);
    }
  }
  async function clearSubmissions(){
    await fetch(FIREBASE_DB_URL + 'submissions.json', { method: 'DELETE' });
  }

  // ---------- routing ----------
  function isAdminRoute(){
    return location.hash === '#admin' || location.search.includes('admin');
  }
  function isAdminAuthed(){
    try{ return sessionStorage.getItem(ADMIN_SESSION_KEY) === 'true'; }
    catch(e){ return false; }
  }
  function showAdmin(){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('adminApp').classList.remove('hidden');
    if(isAdminAuthed()){
      document.getElementById('adminLoginPanel').classList.add('hidden');
      document.getElementById('adminListPanel').classList.remove('hidden');
      loadAdminList();
    }else{
      document.getElementById('adminListPanel').classList.add('hidden');
      document.getElementById('adminLoginPanel').classList.remove('hidden');
      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('adminPasswordError').textContent = '';
    }
  }
  function showMain(){
    document.getElementById('adminApp').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }
  window.addEventListener('hashchange', ()=>{
    if(isAdminRoute()) showAdmin(); else showMain();
  });
  on('backLink', 'click', (e)=>{
    e.preventDefault();
    location.hash = '';
    showMain();
  });
  on('backLinkLogin', 'click', (e)=>{
    e.preventDefault();
    location.hash = '';
    showMain();
  });

  function attemptAdminLogin(){
    const pwInput = document.getElementById('adminPasswordInput');
    const pwError = document.getElementById('adminPasswordError');
    if(pwInput.value === ADMIN_PASSWORD){
      try{ sessionStorage.setItem(ADMIN_SESSION_KEY, 'true'); }catch(e){}
      pwError.textContent = '';
      document.getElementById('adminLoginPanel').classList.add('hidden');
      document.getElementById('adminListPanel').classList.remove('hidden');
      loadAdminList();
    }else{
      pwError.textContent = 'wrong password 🚫';
      pwInput.classList.remove('shake'); void pwInput.offsetWidth; pwInput.classList.add('shake');
    }
  }
  on('adminLoginBtn', 'click', attemptAdminLogin);
  on('adminPasswordInput', 'keydown', (e)=>{
    if(e.key === 'Enter') attemptAdminLogin();
  });

  // ---------- screen 1: name entry ----------
  const nameInput = document.getElementById('nameInput');
  const nameError = document.getElementById('nameError');
  const continueBtn = document.getElementById('continueBtn');
  let currentName = '';

  function validateAndContinue(){
    const val = nameInput.value.trim();
    if(!val){
      nameError.textContent = 'please enter a name 🥺';
      nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake');
      return;
    }
    if(containsEmoji(val)){
      nameError.textContent = 'no emojis allowed, just your name 🙅‍♀️';
      nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake');
      return;
    }
    if(isBlockedName(val)){
      nameError.textContent = "your name isn't lakshy/luv/lakshya👿";
      nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake');
      return;
    }
    nameError.textContent = '';
    currentName = val;
    document.getElementById('screenName').classList.add('hidden');
    document.getElementById('screenProposal').classList.remove('hidden');
  }
  on('continueBtn', 'click', validateAndContinue);
  on('nameInput', 'keydown', (e)=>{ if(e.key === 'Enter') validateAndContinue(); });

  // ---------- screen 2: dodging no button ----------
  const btnRow = document.getElementById('btnRow');
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');

  function dodge(){
    const rowRect = btnRow.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const maxLeft = Math.max(rowRect.width - btnW, 0);
    const newLeft = Math.random() * maxLeft;
    const newTop = (Math.random() * 30) - 10;
    noBtn.style.left = newLeft + 'px';
    noBtn.style.top = newTop + 'px';
  }
  on('noBtn', 'mouseenter', dodge);
  on('noBtn', 'touchstart', function(e){ e.preventDefault(); dodge(); });
  on('noBtn', 'mousemove', dodge);
  on('noBtn', 'click', function(e){ e.preventDefault(); dodge(); });

  // ---------- screen 3: yes click ----------
  function launchConfetti(){
    const colors = ['#FF2E76','#9D4EDD','#FFD60A','#4DD599','#4D9BFF'];
    for(let i=0;i<60;i++){
      setTimeout(()=>{
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2 + Math.random()*1.5) + 's';
        document.body.appendChild(c);
        setTimeout(()=> c.remove(), 3600);
      }, i*20);
    }
  }

  on('yesBtn', 'click', function(){
    document.getElementById('screenProposal').classList.add('hidden');
    const resultScreen = document.getElementById('screenResult');
    document.getElementById('resultText').innerHTML =
      currentName + ', tu gay hai!!!!<span class="emoji-plain">😿🫵🏼</span>.<br><br>By the way congratulations <span class="emoji-plain">🥳🎉</span><br>cause now you are a certified GAY <span class="emoji-plain">🏳️‍🌈</span>';
    resultScreen.classList.remove('hidden');
    launchConfetti();
    saveSubmission(currentName);
  });

  on('againBtn', 'click', function(){
    nameInput.value = '';
    currentName = '';
    document.getElementById('screenResult').classList.add('hidden');
    document.getElementById('screenName').classList.remove('hidden');
    noBtn.style.left = '58%';
    noBtn.style.top = '0';
  });

  // ---------- admin panel ----------
  async function loadAdminList(){
    const listEl = document.getElementById('gayList');
    const countEl = document.getElementById('adminCount');
    listEl.innerHTML = '';
    countEl.textContent = 'loading...';
    let entries;
    try{
      entries = await getSubmissions();
    }catch(e){
      console.error(e);
      countEl.textContent = 'could not load the list';
      listEl.innerHTML = '<div class="empty-state">something went wrong reaching the database. check your Firebase URL and rules.</div>';
      return;
    }
    entries.sort((a,b) => b.ts - a.ts);
    if(entries.length === 0){
      countEl.textContent = 'no submissions yet';
      listEl.innerHTML = '<div class="empty-state">nobody has fallen for it... yet 😈</div>';
      return;
    }
    countEl.textContent = entries.length + ' certified GAY submission' + (entries.length===1?'':'s');
    entries.forEach(entry => {
      const li = document.createElement('li');
      const date = new Date(entry.ts);
      li.innerHTML = '<span>' + escapeHtml(entry.name) + '<span class="ts">' + date.toLocaleString() + '</span></span>' +
                      '<span class="tag-certified">certified GAY</span>';
      listEl.appendChild(li);
    });
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  on('refreshBtn', 'click', loadAdminList);
  on('clearBtn', 'click', async function(){
    if(confirm('clear the entire GAY list? this cannot be undone.')){
      await clearSubmissions();
      loadAdminList();
    }
  });

  // ---------- init ----------
  if(isAdminRoute()) showAdmin();
})();
</script>

</body>
</html>
