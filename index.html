<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aura Calculator</title>
<style>
  :root{
    --bg:#0b0518;
    --panel:rgba(255,255,255,.05);
    --line:rgba(255,255,255,.12);
    --text:#f3ecff;
    --muted:#b8a8d9;
    --p1:#a855f7;
    --p2:#ec4899;
    --p3:#6366f1;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',system-ui,sans-serif;
    overflow-x:hidden;
  }
  canvas#bg{
    position:fixed;inset:0;
    z-index:0;
  }
  .wrap{
    position:relative;z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw 5vw;
  }
  .card{
    width:100%;
    max-width:440px;
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:22px;
    padding:2.4rem 2rem;
    text-align:center;
    box-shadow:0 30px 80px -30px rgba(168,85,247,.35);
  }
  h1{
    font-size:1.6rem;
    letter-spacing:.02em;
    background:linear-gradient(120deg,var(--p1),var(--p2),var(--p3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:.4rem;
  }
  .sub{
    font-size:.8rem;
    color:var(--muted);
    margin-bottom:2rem;
    letter-spacing:.04em;
  }
  .field{
    text-align:left;
    margin-bottom:1.1rem;
  }
  .field label{
    display:block;
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--muted);
    margin-bottom:.4rem;
  }
  .field input{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    border-radius:10px;
    padding:.85rem 1rem;
    color:var(--text);
    font-size:1rem;
    font-family:inherit;
    outline:none;
    transition:border-color .25s, background .25s;
  }
  .field input:focus{
    border-color:var(--p1);
    background:rgba(255,255,255,.09);
  }
  .field .hint{
    font-size:.68rem;
    color:var(--muted);
    opacity:.6;
    margin-top:.3rem;
  }
  button{
    width:100%;
    font-family:inherit;
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.05em;
    color:#fff;
    background:linear-gradient(120deg,var(--p1),var(--p2));
    border:none;
    border-radius:12px;
    padding:1rem;
    cursor:pointer;
    margin-top:.6rem;
    transition:transform .2s, box-shadow .2s;
  }
  button:active{transform:scale(.97);}
  button:hover{box-shadow:0 12px 30px -8px rgba(236,72,153,.55);}

  .result{display:none;}
  .result.show{display:block;}
  .warning{
    display:none;
    align-items:center;
    justify-content:center;
    gap:.6rem;
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#ffdede;
    background:rgba(255,40,40,.08);
    border:1px solid rgba(255,80,80,.5);
    border-radius:12px;
    padding:.75rem 1rem;
    margin-bottom:1.4rem;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .warning svg{
    width:18px;height:18px;
    flex-shrink:0;
    animation:iconPulse 1s ease-in-out infinite;
  }
  .result.infinite .warning{
    display:flex;
    animation:warnGlow 1.4s ease-in-out infinite;
  }
  @keyframes warnGlow{
    0%,100%{
      box-shadow:0 0 0 rgba(255,60,60,0);
      border-color:rgba(255,80,80,.4);
    }
    50%{
      box-shadow:0 0 22px rgba(255,60,60,.45);
      border-color:rgba(255,120,120,.9);
    }
  }
  @keyframes iconPulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.6; transform:scale(1.12); }
  }

  .result .ring{
    width:190px;height:190px;
    margin:0 auto 1.4rem;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(from 0deg, var(--p1), var(--p2), var(--p3), var(--p1));
    position:relative;
    animation:spin 6s linear infinite;
  }
  .result .ring::before{
    content:'';
    position:absolute;inset:8px;
    background:var(--bg);
    border-radius:50%;
  }
  .result .ring .num{
    position:relative;z-index:2;
    font-size:2.2rem;
    font-weight:800;
    animation:none;
    font-variant-numeric:tabular-nums;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .result .name-line{
    font-size:.95rem;
    color:var(--muted);
    margin-bottom:.3rem;
  }
  .result .aura-label{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:var(--muted);
    margin-bottom:1.5rem;
  }
  .result .message{
    font-size:1.05rem;
    line-height:1.6;
    padding:1rem 1.2rem;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:1.6rem;
  }
  .result.infinite .ring{
    animation:spin 1.4s linear infinite, shake .35s ease-in-out infinite;
    background:conic-gradient(from 0deg,#ff9933,#ffffff,#138808,#ff9933);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-3px) rotate(-1deg);}
    75%{transform:translateX(3px) rotate(1deg);}
  }
  .result.infinite .num{
    color:#fff;
    text-shadow:0 0 18px #ff9933, 0 0 30px #138808;
  }
  .result.infinite .message{
    border-color:#ff9933;
    animation:flash 1s infinite;
  }
  @keyframes flash{
    0%,100%{background:rgba(255,153,51,.08);}
    50%{background:rgba(19,136,8,.12);}
  }

  .reset{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-weight:500;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="wrap">
  <div class="card">

    <div id="inputScreen">
      <h1>✨ Aura Calculator</h1>
      <p class="sub">Enter your name and find out your true aura</p>

      <div class="field">
        <label for="nameInput">Your Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Rohan" autocomplete="off">
      </div>

      <div class="field">
        <label for="ageInput">Age (optional)</label>
        <input type="number" id="ageInput" placeholder="e.g. 21" min="0" max="120">
        <div class="hint">Leave blank if you don't want to share</div>
      </div>

      <button id="calcBtn">Calculate My Aura</button>
    </div>

    <div id="resultScreen" class="result">
      <div class="warning" id="warningSign">⚠️ WARNING: AURA OVERLOAD DETECTED ⚠️</div>
      <div class="ring"><div class="num" id="auraNum">0</div></div>
      <div class="name-line" id="nameLine"></div>
      <div class="aura-label" id="auraLabel">AURA POINTS</div>
      <div class="message" id="messageBox"></div>
      <button class="reset" id="resetBtn">Calculate Again</button>
    </div>

  </div>
</div>

<audio id="voiceMsg" src="modi-ji-bhojyam.mp3" loop></audio>

<script>
/* ---------------- background floating particles ---------------- */
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
function resizeBg(){ bgCanvas.width = innerWidth; bgCanvas.height = innerHeight; }
window.addEventListener('resize', resizeBg); resizeBg();

let particles = Array.from({length:45}, () => ({
  x: Math.random()*innerWidth,
  y: Math.random()*innerHeight,
  r: Math.random()*2+0.6,
  vx: (Math.random()-0.5)*0.25,
  vy: (Math.random()-0.5)*0.25,
  hue: 260 + Math.random()*80
}));
function drawBg(){
  bgCtx.fillStyle = '#0b0518';
  bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  for(const p of particles){
    p.x += p.vx; p.y += p.vy;
    if(p.x<0) p.x=innerWidth; if(p.x>innerWidth) p.x=0;
    if(p.y<0) p.y=innerHeight; if(p.y>innerHeight) p.y=0;
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle = `hsla(${p.hue},90%,70%,0.55)`;
    bgCtx.shadowBlur = 8;
    bgCtx.shadowColor = `hsla(${p.hue},90%,70%,0.8)`;
    bgCtx.fill();
  }
  requestAnimationFrame(drawBg);
}
drawBg();

/* ---------------- aura logic ---------------- */
const inputScreen = document.getElementById('inputScreen');
const resultScreen = document.getElementById('resultScreen');
const nameInput = document.getElementById('nameInput');
const ageInput = document.getElementById('ageInput');
const calcBtn = document.getElementById('calcBtn');
const resetBtn = document.getElementById('resetBtn');
const auraNum = document.getElementById('auraNum');
const nameLine = document.getElementById('nameLine');
const auraLabel = document.getElementById('auraLabel');
const messageBox = document.getElementById('messageBox');

let infiniteTimer = null;
let speechTimer = null;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ');
}

function hashName(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = (hash*31 + str.charCodeAt(i)) >>> 0;
  }
  return hash;
}

function tierMessage(aura){
  if(aura < 2000) return "Aura still loading... keep grinding 💪";
  if(aura < 4500) return "Decent aura, there's room to grow ✨";
  if(aura < 7000) return "Strong aura detected 🔥";
  if(aura < 9000) return "Elite aura! People feel it when you walk in 😎";
  return "Legendary aura. Absolute main character energy 👑";
}

function animateCount(target, duration=1400){
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    auraNum.textContent = Math.floor(eased * target).toLocaleString();
    if(t < 1) requestAnimationFrame(step);
    else auraNum.textContent = target.toLocaleString();
  }
  requestAnimationFrame(step);
}

const voiceMsg = document.getElementById('voiceMsg');

function stopInfinite(){
  if(infiniteTimer){ clearInterval(infiniteTimer); infiniteTimer = null; }
  if(speechTimer){ clearInterval(speechTimer); speechTimer = null; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  voiceMsg.pause();
  voiceMsg.currentTime = 0;
  resultScreen.classList.remove('infinite');
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

calcBtn.addEventListener('click', () => {
  const rawName = nameInput.value;
  const name = normalize(rawName);
  const ageVal = ageInput.value;

  if(!rawName.trim()){
    nameInput.focus();
    return;
  }

  inputScreen.style.display = 'none';
  resultScreen.classList.add('show');
  resultScreen.classList.remove('infinite');
  stopInfinite();

  nameLine.textContent = rawName.trim();

  const modiNames = ['modi','modi ji','modiji','narendra modi'];
  const isModi = modiNames.includes(name);
  const isVivek = name === 'vivek';

  if(isModi){
    /* -------- infinite aura mode -------- */
    resultScreen.classList.add('infinite');
    auraLabel.textContent = 'AURA POINTS (INFINITE)';
    messageBox.textContent = "⚡ AURA CANNOT BE MEASURED. CALCULATION OVERFLOW ⚡";

    let count = 0;
    auraNum.textContent = '0';
    infiniteTimer = setInterval(() => {
      count += Math.floor(Math.random()*4000 + 1500);
      auraNum.textContent = count.toLocaleString();
    }, 20);

    document.getElementById('voiceMsg').play();

  } else if(isVivek){
    /* -------- special case: vivek -------- */
    const hash = hashName(name);
    const aura = 7500 + (hash % 1500); // always high tier
    auraLabel.textContent = 'AURA POINTS';
    animateCount(aura);
    messageBox.textContent = "Bhai, you will build your dream body, keep it up❤️‍🔥🫡";

  } else {
    /* -------- normal calculation -------- */
    const hash = hashName(name);
    let aura = (hash % 9000) + 100;
    if(ageVal !== '' && !isNaN(ageVal)){
      aura += parseInt(ageVal,10) * 3;
    }
    aura = Math.min(aura, 9999);
    auraLabel.textContent = 'AURA POINTS';
    animateCount(aura);
    messageBox.textContent = tierMessage(aura);
  }
});

resetBtn.addEventListener('click', () => {
  stopInfinite();
  resultScreen.classList.remove('show','infinite');
  inputScreen.style.display = 'block';
  nameInput.value = '';
  ageInput.value = '';
  nameInput.focus();
});
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</body>
</html>
