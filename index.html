<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141a;
    --surface: #1c1f28;
    --surface-2: #0d0f14;
    --line: #2a2e39;
    --accent: #b8905c;
    --accent-hover: #a37e4e;
    --text: #ece9e2;
    --muted: #888c98;
    --danger: #c17862;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
  }

  /* ---- Lock screen ---- */
  #lock-screen {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .lock-icon {
    margin: 0 auto 28px;
    width: 40px;
    height: 40px;
    opacity: 0.85;
  }
  #lock-screen h1 {
    font-size: 30px;
    margin: 0 0 6px;
    font-weight: 500;
  }
  .lock-sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
  }
  .field {
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
    transition: border-color 0.2s;
  }
  .field:focus-within { border-color: var(--accent); }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    padding: 8px 2px;
    text-align: center;
    outline: none;
  }
  .field input::placeholder { color: var(--muted); }
  .error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 14px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    background: var(--accent);
    color: #17130d;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    padding: 8px;
  }
  .btn-ghost:hover { color: var(--text); }

  /* ---- Vault screen ---- */
  #vault-screen {
    display: none;
    width: 100%;
    max-width: 560px;
  }
  .vault-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }
  .vault-header h1 {
    font-size: 24px;
    margin: 0;
    font-weight: 500;
  }
  .count-note {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { color: var(--text); border-color: #3a3f4d; }

  #upload-input { display: none; }
  .dropzone {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 24px;
    transition: border-color 0.2s, color 0.2s;
  }
  .dropzone:hover { border-color: var(--accent); color: var(--text); }
  .dropzone svg { flex-shrink: 0; opacity: 0.8; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .photo-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
  }
  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-item.pending img { opacity: 0.4; }
  .pending-spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-actions {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .photo-item:hover .photo-actions,
  .photo-item:focus-within .photo-actions { opacity: 1; }
  .mini-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(13,15,20,0.75);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eee;
  }
  .mini-btn:hover { background: rgba(13,15,20,0.95); }
  .mini-btn.danger:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 48px 0;
  }
  .status-line {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 18px;
    min-height: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="lock-screen">
  <svg class="lock-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="9" y="18" width="22" height="16" rx="3" stroke="#b8905c" stroke-width="1.6"/>
    <path d="M14 18v-5a6 6 0 0 1 12 0v5" stroke="#b8905c" stroke-width="1.6"/>
    <circle cx="20" cy="25" r="2" fill="#b8905c"/>
  </svg>
  <h1 class="wordmark">Vault</h1>
  <p class="lock-sub">Your photos, kept quietly.</p>
  <div class="field">
    <input type="password" id="password-input" placeholder="Password" autofocus>
  </div>
  <div class="error" id="lock-error"></div>
  <button class="btn-primary" id="unlock-btn">Unlock</button>
</div>

<div id="vault-screen">
  <div class="vault-header">
    <div>
      <h1 class="wordmark">Vault</h1>
      <div class="count-note" id="count-note">No photos yet</div>
    </div>
    <button class="icon-btn" id="lock-again-btn" title="Lock">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
  </div>

  <input type="file" id="upload-input" accept="image/*" multiple>
  <label for="upload-input" class="dropzone">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Add photos
  </label>

  <div class="gallery" id="gallery"></div>
  <div class="empty-state" id="empty-state">Nothing here yet. Add your first photo above.</div>
  <div class="status-line" id="status-line"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getStorage, ref, uploadBytes, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  // ---- Vault password ----
  // Change this value directly to set/change the vault password.
  const VAULT_PASSWORD = "changeme123";

  // ---- Firebase setup ----
  const firebaseConfig = {
    apiKey: "AIzaSyAB0MjSvpUVQlQy9PGW-P_G5orE3fjBZP0",
    authDomain: "prank-75eb8.firebaseapp.com",
    databaseURL: "https://prank-75eb8-default-rtdb.firebaseio.com",
    projectId: "prank-75eb8",
    storageBucket: "prank-75eb8.firebasestorage.app",
    messagingSenderId: "300577190027",
    appId: "1:300577190027:web:93feb272937c8a6284648e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const photosCollection = collection(db, "vault_photos");

  // ---- Elements ----
  const lockScreen = document.getElementById('lock-screen');
  const vaultScreen = document.getElementById('vault-screen');
  const passwordInput = document.getElementById('password-input');
  const lockError = document.getElementById('lock-error');
  const unlockBtn = document.getElementById('unlock-btn');
  const uploadInput = document.getElementById('upload-input');
  const gallery = document.getElementById('gallery');
  const emptyState = document.getElementById('empty-state');
  const countNote = document.getElementById('count-note');
  const statusLine = document.getElementById('status-line');
  const lockAgainBtn = document.getElementById('lock-again-btn');

  let unsubscribe = null;

  function tryUnlock() {
    const val = passwordInput.value;
    if (!val) {
      lockError.textContent = 'Enter a password first';
      return;
    }
    if (val === VAULT_PASSWORD) {
      lockError.textContent = '';
      passwordInput.value = '';
      lockScreen.style.display = 'none';
      vaultScreen.style.display = 'block';
      startListening();
    } else {
      lockError.textContent = 'Wrong password. Try again.';
      passwordInput.value = '';
    }
  }

  function lockVault() {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    vaultScreen.style.display = 'none';
    lockScreen.style.display = 'block';
    passwordInput.focus();
  }

  function startListening() {
    const q = query(photosCollection, orderBy('createdAt', 'desc'));
    unsubscribe = onSnapshot(q, (snapshot) => {
      const photos = [];
      snapshot.forEach((docSnap) => {
        photos.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderGallery(photos);
    }, (err) => {
      statusLine.textContent = 'Could not load photos: ' + err.message;
    });
  }

  function renderGallery(photos) {
    gallery.innerHTML = '';
    emptyState.style.display = photos.length === 0 ? 'block' : 'none';
    countNote.textContent = photos.length === 0
      ? 'No photos yet'
      : photos.length + (photos.length === 1 ? ' photo' : ' photos');

    photos.forEach((photo) => {
      const item = document.createElement('div');
      item.className = 'photo-item';

      const img = document.createElement('img');
      img.src = photo.url;
      img.loading = 'lazy';
      item.appendChild(img);

      const actions = document.createElement('div');
      actions.className = 'photo-actions';

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'mini-btn';
      downloadBtn.title = 'Download';
      downloadBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 4v11M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      downloadBtn.onclick = () => downloadPhoto(photo);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'mini-btn danger';
      deleteBtn.title = 'Delete';
      deleteBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2m-7 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      deleteBtn.onclick = () => deletePhoto(photo);

      actions.appendChild(downloadBtn);
      actions.appendChild(deleteBtn);
      item.appendChild(actions);

      gallery.appendChild(item);
    });
  }

  async function downloadPhoto(photo) {
    try {
      const response = await fetch(photo.url);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = photo.name || 'photo.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    } catch (err) {
      statusLine.textContent = 'Download failed: ' + err.message;
    }
  }

  async function deletePhoto(photo) {
    try {
      if (photo.storagePath) {
        await deleteObject(ref(storage, photo.storagePath));
      }
      await deleteDoc(doc(db, 'vault_photos', photo.id));
    } catch (err) {
      statusLine.textContent = 'Delete failed: ' + err.message;
    }
  }

  uploadInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    statusLine.textContent = 'Uploading ' + files.length + (files.length === 1 ? ' photo…' : ' photos…');

    for (const file of files) {
      try {
        const storagePath = 'vault/' + Date.now() + '_' + Math.random().toString(36).slice(2) + '_' + file.name;
        const storageRef = ref(storage, storagePath);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        await addDoc(photosCollection, {
          url,
          storagePath,
          name: file.name,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        statusLine.textContent = 'Upload failed: ' + err.message;
      }
    }

    statusLine.textContent = '';
    uploadInput.value = '';
  });

  unlockBtn.addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
  lockAgainBtn.addEventListener('click', lockVault);
</script>

</body>
</html>
